<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โรงภาพยนตร์ WebRTC P2P</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (typeof io !== 'undefined') {
            console.log('Socket.io client loaded successfully');
        } else {
            console.error('Socket.io client failed to load');
            alert('ข้อผิดพลาด: ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของคุณหรือลองใหม่อีกครั้งในภายหลัง');
        }
    </script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Join Screen -->
    <div id="join-screen" class="screen active">
        <div class="card">
            <div class="card-header">
                <div class="icon-bg">
                    <i class="fas fa-film"></i>
                </div>
                <h1>โรงภาพยนตร์ P2P</h1>
                <p>ดูหนังพร้อมกันกับเพื่อนๆ</p>
            </div>
            
            <div class="input-group">
                <i class="fas fa-ticket-alt"></i>
                <input type="text" id="nickname-input" placeholder="ชื่อผู้ชม (เช่น 'คนดู 1')" autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-door-open"></i>
                <input type="text" id="room-input" placeholder="หมายเลขโรงหนัง (เช่น 101)" autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="password" id="password-input" placeholder="รหัสผ่าน (ถ้ามี)" autocomplete="off">
            </div>

            <button id="join-btn" class="primary-btn">
                <span>เข้าสู่โรงหนัง</span>
                <i class="fas fa-play"></i>
            </button>
        </div>
    </div>

    <!-- Room Screen -->
    <div id="room-screen" class="screen" style="display: none;">
        <header class="room-header">
            <div class="room-info">
                <i class="fas fa-film"></i>
                <span id="room-id-display">หมายเลขโรง</span>
                <span class="viewer-count-badge"><i class="fas fa-users"></i> <span id="viewer-count">1</span></span>
                <button id="copy-link-btn" class="icon-btn" title="คัดลอกตั๋วเชิญ">
                    <i class="fas fa-ticket-alt"></i>
                </button>
                <button id="theater-mode-btn" class="icon-btn" title="โหมดโรงหนัง">
                    <i class="fas fa-rectangle-wide"></i>
                </button>
            </div>
            <div class="connection-status">
                <div class="status-dot"></div>
                <span id="connection-text">กำลังฉาย</span>
                <span id="ping-display" style="font-size: 0.8rem; margin-left: 5px; opacity: 0.7;">(0ms)</span>
            </div>
        </header>

        <main id="video-grid">
            <div class="video-wrapper local">
                <div class="camera-off-indicator">
                    <i class="fas fa-video-slash"></i>
                    <span>กล้องปิด</span>
                </div>
                <div class="screen-share-indicator">
                    <i class="fas fa-desktop"></i>
                    <span>กำลังแชร์หน้าจอ</span>
                </div>
                <video id="local-video" autoplay playsinline muted></video>
                <button class="icon-btn pip-btn" title="โหมดภาพซ้อนภาพ">
                    <i class="fas fa-images"></i>
                </button>
                <button class="icon-btn expand-btn" title="เต็มหน้าจอ">
                    <i class="fas fa-expand"></i>
                </button>
                <div class="video-overlay">
                    <span class="user-label">คุณ</span>
                    <div class="audio-indicator"><i class="fas fa-microphone"></i></div>
                </div>
            </div>
            <!-- Remote videos will be added here dynamically -->
        </main>

        <!-- Emoji Container -->
        <div id="emoji-container"></div>

        <!-- Game Modal -->
        <div id="game-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-gamepad"></i> Tic-Tac-Toe</h2>
                    <button id="close-game-btn" class="icon-btn"><i class="fas fa-times"></i></button>
                </div>
                <div class="game-body">
                    <span id="game-status">รอเริ่มเกม...</span>
                    <div class="tic-tac-toe-board">
                        <div class="cell" data-index="0"></div>
                        <div class="cell" data-index="1"></div>
                        <div class="cell" data-index="2"></div>
                        <div class="cell" data-index="3"></div>
                        <div class="cell" data-index="4"></div>
                        <div class="cell" data-index="5"></div>
                        <div class="cell" data-index="6"></div>
                        <div class="cell" data-index="7"></div>
                        <div class="cell" data-index="8"></div>
                    </div>
                    <button id="reset-game-btn" class="secondary-btn">
                        <i class="fas fa-redo"></i> เริ่มใหม่
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div id="chat-container" class="chat-container">
            <div class="chat-header">
                <h3>แชทสด</h3>
                <button id="close-chat" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
                <button id="send-btn" class="icon-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <footer class="controls-bar">
            <button id="mic-btn" class="control-btn active" title="เปิด/ปิด ไมโครโฟน">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="camera-btn" class="control-btn active" title="เปิด/ปิด กล้อง">
                <i class="fas fa-video"></i>
            </button>
            <button id="screen-btn" class="control-btn" title="แชร์หน้าจอ">
                <i class="fas fa-desktop"></i>
            </button>
            <div class="reaction-wrapper">
                <button id="reaction-btn" class="control-btn" title="ส่งความรู้สึก">
                    <i class="fas fa-smile"></i>
                </button>
                <div class="reaction-menu">
                    <span data-emoji="❤️">❤️</span>
                    <span data-emoji="😂">😂</span>
                    <span data-emoji="😮">😮</span>
                    <span data-emoji="👏">👏</span>
                    <span data-emoji="🎉">🎉</span>
                </div>
            </div>

            <!-- Sound Board -->
            <div class="reaction-wrapper">
                <button id="sound-btn" class="control-btn" title="เอฟเฟกต์เสียง">
                    <i class="fas fa-music"></i>
                </button>
                <div class="reaction-menu sound-menu">
                    <span data-sound="clap" title="ปรบมือ">👏</span>
                    <span data-sound="laugh" title="หัวเราะ">😂</span>
                    <span data-sound="drum" title="กลอง">🥁</span>
                    <span data-sound="horn" title="แตรลม">📢</span>
                </div>
            </div>

            <button id="chat-btn" class="control-btn" title="แชท">
                <i class="fas fa-comment-alt"></i>
                <span id="unread-badge" class="badge"></span>
            </button>
            <button id="game-btn" class="control-btn" title="เล่นเกม XO">
                <i class="fas fa-gamepad"></i>
            </button>
            <button id="stop-share-btn" class="control-btn danger" title="หยุดแชร์" style="display: none;">
                <i class="fas fa-stop-circle"></i>
            </button>
            <div class="divider"></div>
            <button id="leave-btn" class="control-btn danger" title="ออกจากห้อง">
                <i class="fas fa-phone-slash"></i>
            </button>
        </footer>
    </div>
</body>
</html>
